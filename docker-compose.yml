version: '3.8'
services:
  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      # Override localhost values from .env to reach service containers
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    command: sh -c "npm install && npm run start:dev"

  postgres:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_DB: foaman_worker
      POSTGRES_USER: foaman
      POSTGRES_PASSWORD: foaman123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres-data:
